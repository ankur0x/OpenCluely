<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenCluely</title>
  <link rel="stylesheet" href="./src/styles/common.css">
  <link rel="stylesheet" href="./src/styles/chat.css">
</head>
<body class="floating-panel">
  <header class="panel-bar">
    <div class="panel-grip" aria-label="OpenCluely drag handle" role="img"><i class="fas fa-grip" aria-hidden="true"></i></div>
    <button type="button" id="closeChat" aria-expanded="true" aria-controls="panelBody"><i id="hideIcon" class="fas fa-chevron-up" aria-hidden="true"></i> <span id="hideLabel">Hide</span></button>
    <button type="button" id="session" class="icon-button" aria-label="Stop session"><i id="sessionIcon" class="fas fa-stop" aria-hidden="true"></i></button>
    <button type="button" id="settings" class="icon-button" aria-label="Settings"><i class="fas fa-gear" aria-hidden="true"></i></button>
  </header>
  <section id="panelBody" class="panel-body" aria-label="Conversation and controls">
    <div class="chat-header">
      <span id="micStatus" role="status">Mic off</span>
      <div class="clear-tools">
        <button type="button" id="clearHistory" aria-expanded="false" aria-controls="clearPrompt">Clear history</button>
        <div id="clearPrompt" role="group" aria-label="Confirm clearing saved messages and model context" hidden>
          <button type="button" id="cancelClear" aria-label="Cancel clearing history">&#10006;&#65039;</button>
          <button type="button" id="confirmClear" aria-label="Confirm clearing history">&#10062;</button>
        </div>
      </div>
    </div>
    <main id="messages" aria-label="Conversation">
      <p id="emptyState">Type a message, add a screenshot, or turn on the mic.</p>
    </main>
    <p id="interim" aria-label="Live transcription" hidden></p>
    <form id="compose">
      <section id="attachment" aria-label="Draft image attachments" hidden>
        <div id="draftImages" class="image-grid"></div>
        <p id="screenshotNotice"></p>
      </section>
      <p id="chatError" role="alert" hidden></p>
      <textarea id="draft" rows="2" aria-label="Message" placeholder="Ask anything. Paste or drop images here."></textarea>
      <div class="actions composer">
        <select id="answerProvider" hidden size="2" data-inline-picker aria-label="Answer provider"><option value="">Provider</option></select>
        <select id="answerModel" hidden size="2" data-inline-picker aria-label="Answer model"><option value="">Answer model</option></select>
        <select id="voiceModel" hidden size="2" data-inline-picker aria-label="Voice model"><option value="">Voice model</option></select>
        <button type="button" id="mic" class="icon-button" aria-label="Turn microphone on" aria-pressed="false" disabled><i id="micIcon" class="fas fa-microphone-slash" aria-hidden="true"></i></button>
        <button type="button" id="capture" class="icon-button" aria-label="Capture screenshot" aria-keyshortcuts="Control+Shift+S"><i class="fas fa-camera" aria-hidden="true"></i></button>
        <button type="submit" id="send" class="icon-button" aria-label="Send message"><i class="fas fa-arrow-up" aria-hidden="true"></i></button>
      </div>
      <p id="sessionNote" class="session-note">Live transcripts go to the selected model when the mic is on.</p>
    </form>
  </section>
  <section id="imageViewer" class="image-viewer" role="dialog" aria-label="Image preview" hidden>
    <button type="button" id="closeImageViewer" aria-label="Close image preview">&#215;</button>
    <img id="fullImage" alt="Attached image preview">
  </section>
  <script src="lib/markdown.js"></script>
  <script src="lib/mathrender.js"></script>
  <script src="./node_modules/prismjs/prism.min.js"></script>
  <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>
  <script src="src/ui/inline-picker.js"></script>
  <script src="src/ui/panel-audio.js"></script>
  <script src="src/ui/chat-images.js"></script>
  <script src="src/ui/unified-chat.js"></script>
</body>
</html>
